name: Publish Kai Floci

on:
  push:
    branches:
      - kai/2.2.0-kai.3
    paths:
      - .github/workflows/kai-release.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-floci-2.2.0-kai.3
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'salilchincholikar/floci'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e66295d4c031486ba52ba96ffc811e18c7bf990f

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25'
          distribution: temurin

      - name: Package tested Kai release
        run: ./mvnw package -DskipTests -B

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish AMD64 and ARM64 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.jvm-package
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/salilchincholikar/floci:2.2.0-kai.3
          build-args: VERSION=2.2.0-kai.3
          labels: |
            org.opencontainers.image.source=https://github.com/salilchincholikar/floci
            org.opencontainers.image.revision=e66295d4c031486ba52ba96ffc811e18c7bf990f
            org.opencontainers.image.version=2.2.0-kai.3
